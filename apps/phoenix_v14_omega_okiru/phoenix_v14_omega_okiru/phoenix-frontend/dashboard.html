<!-- dashboard.html -->
<!DOCTYPE html>
<html>
<head>
    <title>RezTrader Apex - Live Trading Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #00ff9d;
            font-family: 'Courier New', monospace;
        }
        
        /* TradingView-style layout */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 400px;
            grid-template-rows: auto 300px 400px;
            gap: 10px;
            height: 100vh;
            padding: 10px;
        }
        
        /* Chart container */
        .chart-container {
            grid-column: 1;
            grid-row: 1 / 3;
            background: #111115;
            border: 1px solid #00ff9d33;
            border-radius: 8px;
            padding: 15px;
        }
        
        /* Trade stream (like Binance) */
        .trade-stream {
            grid-column: 2;
            grid-row: 1;
            background: #111115;
            border: 1px solid #00ff9d33;
            border-radius: 8px;
            overflow-y: auto;
            padding: 10px;
        }
        
        /* Worker activity */
        .worker-activity {
            grid-column: 2;
            grid-row: 2;
            background: #111115;
            border: 1px solid #00ff9d33;
            border-radius: 8px;
            overflow-y: auto;
            padding: 10px;
        }
        
        /* Constitution dashboard */
        .constitution-dashboard {
            grid-column: 1 / 3;
            grid-row: 3;
            background: #111115;
            border: 1px solid #00ff9d33;
            border-radius: 8px;
            padding: 15px;
        }
        
        .trade-entry {
            border-left: 3px solid #00ff9d;
            padding: 8px;
            margin: 5px 0;
            font-size: 12px;
        }
        
        .trade-buy { border-left-color: #00ff9d; }
        .trade-sell { border-left-color: #ff3366; }
        .trade-blocked { border-left-color: #ffaa00; opacity: 0.6; }
        
        .worker-card {
            background: #1a1a20;
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
        }
        
        .constitution-check {
            font-family: monospace;
            font-size: 11px;
            margin: 2px 0;
        }
        
        .pass { color: #00ff9d; }
        .fail { color: #ff3366; }
        
        .metrics {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .metric-card {
            background: #1a1a20;
            padding: 10px;
            border-radius: 4px;
            flex: 1;
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: bold;
        }
        
        .metric-label {
            font-size: 11px;
            color: #888;
        }
        
        .thinking-bubble {
            background: #1a1a20;
            border-left: 3px solid #00ff9d;
            padding: 8px;
            margin: 5px 0;
            font-style: italic;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Chart Container (TradingView-style) -->
        <div class="chart-container">
            <div class="metrics">
                <div class="metric-card">
                    <div class="metric-label">Portfolio Value</div>
                    <div class="metric-value" id="portfolio-value">₱1,245,678</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">24H PnL</div>
                    <div class="metric-value" id="pnl-24h">+₱23,450</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Win Rate</div>
                    <div class="metric-value" id="win-rate">68.5%</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Active Workers</div>
                    <div class="metric-value" id="active-workers">50</div>
                </div>
            </div>
            <canvas id="chart" width="800" height="400" style="width:100%; height:400px"></canvas>
            <div id="chart-tooltip" style="position: absolute; background: #000; display: none;"></div>
        </div>
        
        <!-- Trade Stream (like Binance) -->
        <div class="trade-stream">
            <h3>📊 LIVE TRADE STREAM</h3>
            <div id="trade-list"></div>
        </div>
        
        <!-- Worker Activity -->
        <div class="worker-activity">
            <h3>🧠 AI WORKER ACTIVITY</h3>
            <div id="worker-list"></div>
        </div>
        
        <!-- Constitution Dashboard -->
        <div class="constitution-dashboard">
            <h3>⚖️ CONSTITUTION DASHBOARD</h3>
            <div class="metrics">
                <div class="metric-card">
                    <div class="metric-label">Integrity Score</div>
                    <div class="metric-value" id="integrity">98.2%</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Drift Chain</div>
                    <div class="metric-value" id="drift-chain">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Blocked Trades</div>
                    <div class="metric-value" id="blocked-trades">0</div>
                </div>
            </div>
            <div id="constitution-checks"></div>
        </div>
    </div>
    
    <script>
        // WebSocket connection to RezTrader
        const ws = new WebSocket('ws://localhost:8765');
        
        // Chart.js for TradingView-style charts
        let chart;
        let chartData = {
            labels: [],
            datasets: [{
                label: 'Price',
                data: [],
                borderColor: '#00ff9d',
                backgroundColor: 'rgba(0, 255, 157, 0.1)',
                fill: true
            }]
        };
        
        ws.onopen = () => {
            console.log('Connected to RezTrader Visualizer');
            ws.send(JSON.stringify({ command: 'subscribe' }));
            ws.send(JSON.stringify({ command: 'get_workers' }));
            ws.send(JSON.stringify({ command: 'get_constitution' }));
        };
        
        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            
            switch(message.type) {
                case 'trade':
                    addTradeToStream(message.data);
                    updateChart(message.data);
                    break;
                case 'reasoning':
                    addReasoningToStream(message.data);
                    break;
                case 'workers':
                    updateWorkerList(message.data);
                    break;
                case 'constitution':
                    updateConstitutionDashboard(message.data);
                    break;
                case 'trade_history':
                    message.data.forEach(trade => addTradeToStream(trade));
                    break;
            }
        };
        
        function addTradeToStream(trade) {
            const tradeList = document.getElementById('trade-list');
            const tradeDiv = document.createElement('div');
            tradeDiv.className = `trade-entry trade-${trade.action}`;
            tradeDiv.innerHTML = `
                <strong>${trade.worker}</strong> | 
                ${trade.action.toUpperCase()} ${trade.symbol} @ ₱${trade.price.toLocaleString()}
                <br>
                <small>${trade.quantity} units | ₱${(trade.price * trade.quantity).toLocaleString()}</small>
                <br>
                <small>🧠 ${trade.reasoning}</small>
                <br>
                <small>⚖️ ${trade.status} | ${new Date(trade.timestamp).toLocaleTimeString()}</small>
            `;
            tradeList.prepend(tradeDiv);
            
            // Keep only last 50 trades
            while(tradeList.children.length > 50) {
                tradeList.removeChild(tradeList.lastChild);
            }
            
            // Update metrics
            updateMetrics(trade);
        }
        
        function addReasoningToStream(reasoning) {
            const tradeList = document.getElementById('trade-list');
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking-bubble';
            thinkingDiv.innerHTML = `
                🤔 ${reasoning.worker} is thinking:<br>
                <small>${reasoning.reasoning}</small>
                <br>
                <small>Confidence: ${(reasoning.confidence * 100).toFixed(1)}%</small>
            `;
            tradeList.prepend(thinkingDiv);
        }
        
        function updateWorkerList(workersData) {
            const workerList = document.getElementById('worker-list');
            workerList.innerHTML = '';
            
            workersData.workers.forEach(worker => {
                const workerDiv = document.createElement('div');
                workerDiv.className = 'worker-card';
                workerDiv.innerHTML = `
                    <strong>${worker.name}</strong>
                    <span style="float:right">${worker.win_rate}% WR</span>
                    <br>
                    <small>Trades today: ${worker.trades_today} | PnL: ₱${worker.pnl.toLocaleString()}</small>
                    <br>
                    <small>Last: ${new Date(worker.last_action).toLocaleTimeString()}</small>
                `;
                workerList.appendChild(workerDiv);
            });
            
            document.getElementById('active-workers').innerText = workersData.active_workers;
        }
        
        function updateConstitutionDashboard(constitution) {
            document.getElementById('integrity').innerText = '98.2%';
            document.getElementById('drift-chain').innerText = constitution.drift_chain.length;
            document.getElementById('blocked-trades').innerText = constitution.metrics.blocked_trades || 0;
            
            const checksDiv = document.getElementById('constitution-checks');
            checksDiv.innerHTML = '';
            
            constitution.recent_checks.slice(-5).forEach(check => {
                const checkDiv = document.createElement('div');
                checkDiv.className = 'constitution-check';
                checkDiv.innerHTML = `
                    ${check.checks.map(c => `
                        <span class="${c.result === 'PASSED' ? 'pass' : 'fail'}">
                            ${c.invariant}: ${c.result}
                        </span>
                    `).join(' | ')}
                `;
                checksDiv.appendChild(checkDiv);
            });
        }
        
        function updateMetrics(trade) {
            // Update portfolio value
            if (trade.action === 'buy') {
                // Simulate portfolio update
                const currentValue = parseFloat(document.getElementById('portfolio-value').innerText.replace(/[^0-9.-]/g, ''));
                const newValue = currentValue - trade.value;
                document.getElementById('portfolio-value').innerText = `₱${newValue.toLocaleString()}`;
            } else if (trade.action === 'sell') {
                const currentValue = parseFloat(document.getElementById('portfolio-value').innerText.replace(/[^0-9.-]/g, ''));
                const newValue = currentValue + trade.value;
                document.getElementById('portfolio-value').innerText = `₱${newValue.toLocaleString()}`;
            }
        }
        
        function updateChart(trade) {
            // Update chart with new price point
            const timestamp = new Date(trade.timestamp).toLocaleTimeString();
            chartData.labels.push(timestamp);
            chartData.datasets[0].data.push(trade.price);
            
            if (chartData.labels.length > 100) {
                chartData.labels.shift();
                chartData.datasets[0].data.shift();
            }
            
            if (chart) {
                chart.update();
            } else {
                const ctx = document.getElementById('chart').getContext('2d');
                chart = new Chart(ctx, {
                    type: 'line',
                    data: chartData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: (context) => `₱${context.raw.toLocaleString()}`
                                }
                            }
                        },
                        scales: {
                            y: {
                                ticks: {
                                    callback: (value) => `₱${value.toLocaleString()}`
                                }
                            }
                        }
                    }
                });
            }
        }
        
        // Add Chart.js library
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
        document.head.appendChild(script);
    </script>
</body>
</html>
