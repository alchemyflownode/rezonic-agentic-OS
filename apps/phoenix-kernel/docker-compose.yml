# docker-compose.yml
version: '3.8'

services:
  # Phoenix Kernel (Backend)
  kernel:
    build: .
    container_name: phoenix-kernel
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./security:/app/security
      - ./monitoring:/app/monitoring
    environment:
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_PORT=8002
      - OLLAMA_URL=http://ollama:11434
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rez-network
    depends_on:
      - ollama

  # Ollama (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: phoenix-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rez-network

  # Phoenix Frontend (Next.js)
  frontend:
    build: ../phoenix-frontend
    container_name: phoenix-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://kernel:8002
      - NEXT_PUBLIC_WS_URL=ws://kernel:8002
    restart: unless-stopped
    networks:
      - rez-network
    depends_on:
      - kernel

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: phoenix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - rez-network

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: phoenix-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=rezadmin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - rez-network
    depends_on:
      - prometheus

networks:
  rez-network:
    driver: bridge

volumes:
  ollama_data:
  prometheus_data:
  grafana_data: